; KIUT default settings -- what "built-in defaults", --settings default and the window's
; reset use. Change a value to change a default; a setting left out, or a value that
; can't be read, takes the code's own (with a note). Every setting is explained in
; docs/SETTINGS.md.

[schematic]
; Font of every text in the schematic: "KiCad Font", KiCad's own font, or the family name of any ...
font = KiCad Font
; yes: KiCad's default colour theme instead of Ulticap's measured colour palette -- no explicit ...
kicad_colors = no
; yes: the .SCH version header is rewritten to V5.00 before reading, for files made with Ulticap ...
v5_header = no
; yes: designators that don't end in a digit (KiCad doesn't take them as annotated) are renamed ...
fix_designators = yes
; yes: a sub-sheet the hierarchy refers to that isn't there is left out and the rest converted. ...
allow_missing_sheets = no
; yes: a .SCH (with its sub-sheets) converts to a KiCad block library, <name>.kicad_blocks in ...
block_library = no
; A net label sits where KiCad can connect it -- a wire end or a point on the wire -- which is ...
label_keep_alignment = no
; Multiplier applied to a reference's text height (over Ulticap's own size).
ref_height_tune = 1
; Multiplier applied to a value's text height (a power symbol's net name too).
value_height_tune = 1
; Multiplier applied to the height of every other symbol field, a symbol's label text and a sheet ...
field_height_tune = 1
; Multiplier applied to plain text: free texts and annotations that aren't labels.
text_height_tune = 1
; Multiplier applied to the height of the texts KiCad attaches to a wire -- net labels, bus ...
label_height_tune = 0.8
; Multiplier applied to pin number text height: KiCad keeps a pin number attached to its pin.
pin_num_height_tune = 0.5
; Multiplier applied to pin name text height and to plain text embedded in the symbol itself (its ...
pin_name_height_tune = 0.5
; Pin name offset from pin endpoint, mm.
offset_pname = 0.005
; Max distance (Ulticap units) a label's anchor may sit from its own POE's wire network before ...
anchor_wire_max_dist = 100
; Width of a thin line, in Ulticap units (real mil = this ÷ 2).
thin_line_width = 6
; Width of a thick line, in Ulticap units (real mil = this ÷ 2).
thick_line_width = 30
; KiCad's label offset ratio in percent (Schematic Setup > Formatting), written into a .kicad_pro ...
label_offset_percent = 0
; KiCad's overbar offset ratio in percent (Schematic Setup > Formatting), written into a ...
overbar_offset_percent = 105

[board]
; Font of every text on the board: "KiCad Font", KiCad's own font, or the family name of any ...
font = KiCad Font
; A DDF that places components but holds no nets, copper or vias may be a design or a shape ...
library_only = ask
; An Ultiboard library's technology as a multi-file set (versions before V4.60), in this order ...
tec_split = 
; Solder mask expansion around each pad, mm.
pad_to_mask_clearance = 0.05
; Minimum solder mask web width between adjacent mask openings, mm.
solder_mask_min_width = 0.15
; Solder paste absolute clearance from the pad edge, mm (negative shrinks the paste aperture ...
pad_to_paste_clearance = 0
; Solder paste relative clearance, as a ratio of pad size (added to the absolute clearance above).
pad_to_paste_clearance_ratio = 0
; Minimum clearance the DRC enforces between solder mask openings and copper, mm.
solder_mask_to_copper_clearance = 0
; KiCad text height = Ultiboard text height ÷ this ratio.
font_height_ratio = 1.208
; KiCad text width = Ultiboard text width × this ratio.
font_width_ratio = 1.186
; Default width for lines, arcs, and circles (board outline, silk, etc.) wherever the DDF doesn't ...
line_width = 0.075
; Maximum gap, mm, between adjacent board-outline endpoints before they're snapped closed into a ...
snap_tolerance = 0.1
; Fallback copper clearance, mm, used where the DDF doesn't specify one.
default_clearance = 0.254
; Fallback copper trace width, mm, used where the DDF doesn't specify one.
default_width = 0.254
; Fallback thermal-relief air gap (spoke-to-pad), mm, used where the DDF doesn't specify one.
default_thermal_gap = 0.254
; Fallback thermal-relief spoke width, mm, used where the DDF doesn't specify one.
default_thermal_width = 0.254
; DDF V2/V3 pre-conversion only: estimated text width = text height × this ratio (unlike V4/V5 ...
v2v3_text_width_ratio = 0.8
; DDF V2/V3 pre-conversion only: estimated text stroke thickness = text height × this ratio.
v2v3_text_thickness_ratio = 0.1667
; DDF V2/V3 only: staircase traces (a diagonal drawn as grid steps) recovered as diagonal traces.
v2v3_staircase_merge = yes
; DDF V2/V3 only: the longest single staircase step recovered as a diagonal, mil.
v2v3_staircase_limit_mil = 
; DDF V2/V3 only: ordinary 90-degree trace corners chamfered (slanted).
v2v3_chamfer = yes
; DDF V2/V3 only: the most trimmed off each leg of a 90-degree corner when chamfering it, mil.
v2v3_corner_slant_limit_mil = 
