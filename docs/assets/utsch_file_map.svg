<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e5fa8"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#cfcfcf" stroke-width="2"/></pattern></defs>
<rect width="1120" height="730" fill="#ffffff"/>
<text x="20" y="26" fill="#222" font-size="16" font-weight="600">The container of a .UTSCH file — blank.UTSCH, a fresh save of a blank design (7,168 bytes, stream 3,752 bytes)</text>
<text x="20" y="46" fill="#555" >Every sector, like the header, is 512 bytes (drawn to scale); the file grows by whole sectors. File offset of a sector = 512 + 512 × sector number.</text>
<rect x="20" y="62" width="385" height="262" fill="#c9d7ec" fill-opacity="0.55" stroke="#666"/>
<text x="28" y="80" fill="#222" font-weight="600">Header · 512 bytes at file offset 0 (offset, field, value)</text>
<text x="28" y="102" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x00</text>
<text x="62" y="102" fill="#333" font-size="11.5">signature <tspan font-weight="600" fill="#111">D0 CF 11 E0 A1 B1 1A E1</tspan></text>
<text x="28" y="118" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x08</text>
<text x="62" y="118" fill="#333" font-size="11.5">class ID <tspan font-weight="600" fill="#111">16 × 00</tspan></text>
<text x="28" y="142" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x18</text>
<text x="62" y="142" fill="#333" font-size="11.5">minor version <tspan font-weight="600" fill="#111">0x3E</tspan></text>
<text x="28" y="158" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x1A</text>
<text x="62" y="158" fill="#333" font-size="11.5">major version <tspan font-weight="600" fill="#111">3</tspan></text>
<text x="28" y="174" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x1C</text>
<text x="62" y="174" fill="#333" font-size="11.5">byte order <tspan font-weight="600" fill="#111">FFFE</tspan></text>
<text x="28" y="190" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x1E</text>
<text x="62" y="190" fill="#333" font-size="11.5">sector shift <tspan font-weight="600" fill="#111">9 → 512</tspan></text>
<text x="28" y="206" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x20</text>
<text x="62" y="206" fill="#333" font-size="11.5">mini sector shift <tspan font-weight="600" fill="#111">6 → 64</tspan></text>
<text x="28" y="222" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x2C</text>
<text x="62" y="222" fill="#333" font-size="11.5">FAT sectors <tspan font-weight="600" fill="#111">1</tspan></text>
<text x="220" y="142" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x30</text>
<text x="254" y="142" fill="#333" font-size="11.5">directory start <tspan font-weight="600" fill="#111">2</tspan></text>
<text x="220" y="158" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x38</text>
<text x="254" y="158" fill="#333" font-size="11.5">mini cut-off <tspan font-weight="600" fill="#111">4,096</tspan></text>
<text x="220" y="174" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x3C</text>
<text x="254" y="174" fill="#333" font-size="11.5">mini FAT start <tspan font-weight="600" fill="#111">4</tspan></text>
<text x="220" y="190" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x40</text>
<text x="254" y="190" fill="#333" font-size="11.5">mini FAT sectors <tspan font-weight="600" fill="#111">1</tspan></text>
<text x="220" y="206" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x44</text>
<text x="254" y="206" fill="#333" font-size="11.5">DIFAT start <tspan font-weight="600" fill="#111">none</tspan></text>
<text x="220" y="222" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x48</text>
<text x="254" y="222" fill="#333" font-size="11.5">DIFAT sectors <tspan font-weight="600" fill="#111">0</tspan></text>
<text x="28" y="246" fill="#555" font-family="Consolas, Menlo, monospace" font-size="11">0x4C</text>
<text x="62" y="246" fill="#333" font-size="11.5">FAT sector list (109 × 4 bytes): <tspan font-weight="600" fill="#111">3, then free</tspan></text>
<rect x="415" y="62" width="337" height="126" fill="#eeeeee" fill-opacity="0.55" stroke="#666"/>
<rect x="415" y="62" width="337" height="126" fill="url(#hatch)" fill-opacity="0.5" stroke="#666"/>
<text x="423" y="80" fill="#222" font-weight="600">Sectors 0–1 · free</text>
<text x="423" y="98" fill="#333" >free in the FAT: leftover memory,</text>
<text x="423" y="114" fill="#333" >in every fresh save</text>
<rect x="762" y="62" width="337" height="126" fill="#f6d58e" fill-opacity="0.55" stroke="#666"/>
<text x="770" y="80" fill="#222" font-weight="600">Sector 2 · directory (4 entries of 128 bytes)</text>
<text x="770" y="98" fill="#333" >0  Root Entry — root storage, class ID {AAA59DC0-…},</text>
<text x="770" y="114" fill="#333" >    save time; owns the mini stream: sector 5, 3,776 bytes</text>
<text x="770" y="130" fill="#333" >1  Contents — stream, 3,752 bytes, from mini sector 0</text>
<text x="770" y="146" fill="#333" >2, 3  empty</text>
<rect x="415" y="198" width="337" height="126" fill="#b9dfb0" fill-opacity="0.55" stroke="#666"/>
<text x="423" y="216" fill="#222" font-weight="600">Sector 3 · FAT (128 entries)</text>
<text x="423" y="234" fill="#333" >0, 1  free</text>
<text x="423" y="250" fill="#333" >2  end (directory)</text>
<text x="423" y="266" fill="#333" >3  FAT sector</text>
<text x="423" y="282" fill="#333" >4  end (mini FAT)</text>
<text x="423" y="298" fill="#333" >5 → 6 → … → 12 → end (mini stream)</text>
<text x="423" y="314" fill="#333" >13 …  free</text>
<rect x="762" y="198" width="337" height="126" fill="#a8dcd6" fill-opacity="0.55" stroke="#666"/>
<text x="770" y="216" fill="#222" font-weight="600">Sector 4 · mini FAT</text>
<text x="770" y="234" fill="#333" >one entry per 64-byte mini sector:</text>
<text x="770" y="250" fill="#333" >0 → 1 → … → 58 → end</text>
<text x="770" y="266" fill="#333" >(the Contents stream)</text>
