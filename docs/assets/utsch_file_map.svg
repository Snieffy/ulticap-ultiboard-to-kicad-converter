<text x="790" y="454" fill="#2e5fa8" text-anchor="middle">FAT chain 5 → 6 → … → 12 → end</text>
<path d="M482,462 L482,470" fill="none" stroke="#9db3d6" stroke-dasharray="4 3"/>
<path d="M1098,462 L1098,470" fill="none" stroke="#9db3d6" stroke-dasharray="4 3"/>
<rect x="482" y="470" width="616" height="56" fill="#bcd2f2" stroke="#666"/>
<text x="490" y="490" fill="#222" font-weight="600">Sectors 5–12 · mini stream (file offset 0x0C00): 59 mini sectors of 64 bytes</text>
<text x="490" y="510" fill="#333" >holds the Contents stream: mini sectors 0–58, 3,752 bytes (24 bytes unused)</text>
<path d="M482,526 L20,568" fill="none" stroke="#9db3d6" stroke-dasharray="4 3"/>
<path d="M1098,526 L1098,568" fill="none" stroke="#9db3d6" stroke-dasharray="4 3"/>
<text x="1090" y="560" fill="#222" text-anchor="end" font-size="13" font-weight="600">The Contents stream, expanded (stream offsets; here file offset = 0x0C00 + stream offset)</text>
<rect x="20" y="568" width="215" height="78" fill="#c9d7ec" stroke="#666"/>
<text x="28" y="588" fill="#222" font-weight="600">0x0000 stream header</text>
<text x="28" y="608" fill="#333" font-family="Consolas, Menlo, monospace" font-size="11">30 02 00 00 01 35 02 33 33</text>
<text x="28" y="628" fill="#555" >schema, "5", "33" (§2)</text>
<rect x="235" y="568" width="185" height="78" fill="#e7d3f0" stroke="#666"/>
<text x="243" y="588" fill="#222" font-weight="600">0x0009 variants</text>
<text x="243" y="608" fill="#333" font-family="Consolas, Menlo, monospace" font-size="11">WORD 1, CDocVariant</text>
<text x="243" y="628" fill="#555" >"DEFAULT", 1, 0 (§7.1)</text>
<rect x="420" y="568" width="215" height="78" fill="#f3e1c4" stroke="#666"/>
<text x="428" y="588" fill="#222" font-weight="600">0x002C fonts</text>
<text x="428" y="608" fill="#333" font-family="Consolas, Menlo, monospace" font-size="11">WORD 1, CAttribFontInfo</text>
<text x="428" y="628" fill="#555" >+ CSerialFont + 2 DWORDs (§7.2)</text>
<rect x="635" y="568" width="110" height="78" fill="#f6efb0" stroke="#666"/>
<text x="643" y="588" fill="#222" font-weight="600">0x0098 nets</text>
<text x="643" y="608" fill="#333" font-family="Consolas, Menlo, monospace" font-size="11">WORD 0</text>
<text x="643" y="628" fill="#555" >no nets (§10)</text>
<rect x="745" y="568" width="355" height="78" fill="#d9ead3" stroke="#666"/>
<text x="753" y="588" fill="#222" font-weight="600">0x009A … 0x0EA7 the other containers</text>
<text x="753" y="608" fill="#333" font-family="Consolas, Menlo, monospace" font-size="11">maps · sheets · label index · OLE · WORD 0</text>
<text x="753" y="628" fill="#555" >34 objects, written in full on first reference (§6)</text>
<text x="20" y="666" fill="#555" >Inside the stream only its 9-byte header has a fixed size. Everything after it has variable length (strings, counts, objects in full or as references), so the offsets above</text>
<text x="20" y="682" fill="#555" >are those of this file: in any other file they are found by reading, never computed.</text>
<text x="20" y="700" fill="#888" font-size="11">Large stream (4,096 bytes or more): no mini FAT and no mini stream; the Contents entry starts at a regular sector and the FAT chains its sectors. Over about 6.9 MB the FAT</text>
<text x="20" y="716" fill="#888" font-size="11">needs more than 109 sectors and DIFAT sectors list the rest (§1.3).</text>
</svg>