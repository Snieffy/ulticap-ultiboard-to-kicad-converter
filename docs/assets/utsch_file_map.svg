<text x="289.5" y="398" fill="#333" text-anchor="middle">directory</text>
<text x="289.5" y="416" fill="#555" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11">0x0600</text>
<rect x="328" y="364" width="77" height="62" fill="#b9dfb0" stroke="#666"/>
