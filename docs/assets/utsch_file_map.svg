<text x="135.5" y="416" fill="#555" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11">0x0200</text>
<rect x="174" y="364" width="77" height="62" fill="#eeeeee" stroke="#666"/>
<rect x="174" y="364" width="77" height="62" fill="url(#hatch)" stroke="#666"/>
