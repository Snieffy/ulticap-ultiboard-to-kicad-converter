<text x="212.5" y="398" fill="#333" text-anchor="middle">free</text>
<text x="212.5" y="416" fill="#555" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11">0x0400</text>
<rect x="251" y="364" width="77" height="62" fill="#f6d58e" stroke="#666"/>
