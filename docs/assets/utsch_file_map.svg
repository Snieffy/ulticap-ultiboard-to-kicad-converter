<text x="366.5" y="398" fill="#333" text-anchor="middle">FAT</text>
<text x="366.5" y="416" fill="#555" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11">0x0800</text>
<rect x="405" y="364" width="77" height="62" fill="#a8dcd6" stroke="#666"/>
